name: Notify Consumers

# Keep this workflow path: the downstream STS policy trusts its job_workflow_ref.

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      version:
        description: Published libddwaf gem version to notify consumers about
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

concurrency:
  group: notify-consumers-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    name: "Notify DataDog/dd-trace-rb"
    if: github.repository == 'DataDog/libddwaf-rb' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-rb
          policy: libddwaf-rb.notify-consumers

      # There appears to be a race condition in token propagation, wait it out
      - name: Wait for token propagation
        run: sleep 30

      - name: Dispatch to DataDog/dd-trace-rb
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/DataDog/dd-trace-rb/dispatches" \
            -f event_type=internal-dep-updated \
            -f "client_payload[gem]=libddwaf" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[commit]=${{ github.sha }}" \
            -f "client_payload[triggered_by]=${{ github.repository }}" \
            -f "client_payload[source_run_url]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
